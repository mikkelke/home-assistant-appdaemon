# BathroomDisplay - sensor.bathroom_display for the round display in the main bathroom (ESPHome node
# bathroom-display): off, someone, or mikkel with a greeting and up to three lines (a title, an icon and
# a chip text each), the night face in sleep mode, the speaker its play button works and the alarm its
# alarm line toggles. See bathroom_display.py.
BathroomDisplay:
  module: bathroom_display
  class: BathroomDisplay
  entity: sensor.bathroom_display
  # Occupancy is binary_sensor.<zone>_active (RoomActive); when it has no opinion the display stays as it
  # was. The zone is also the HA area id whose house_upcoming rows are listed after everything due
  # within 7 days.
  zone: bathroom
  # The name in the greeting and the person attribute, and the audience of house_upcoming rows.
  resident: Mikkel
  # The display hears Mikkel's phone as an iBeacon; the sensor turns unknown once it is out of range.
  # A reading that is at most rssi_fresh_s seconds old identifies him when it is at or above
  # mikkel_rssi_min dBm (near), or at or above rssi_rise_min dBm and at least rssi_rise_db dB above the
  # phone's baseline, its level before the visit (rise). The baseline is the median of the phone's
  # readings from BASELINE_FROM_S (120) down to BASELINE_TO_S (15) seconds before the visit started,
  # -100 dBm when it was not heard then, and holds for the visit: a phone that was already as loud, from
  # a room next door, is not a rise.
  # He stays identified until the room goes inactive. In the bathroom his phone mostly reads -76 to -84;
  # the bedroom next door reaches -76, which a fixed threshold under -75 cannot tell apart.
  rssi_entity: sensor.bathroom_display_mikkel_phone_rssi
  mikkel_rssi_min: -75
  rssi_rise_min: -80
  rssi_rise_db: 6
  rssi_fresh_s: 20
  upcoming_entity: sensor.house_upcoming
  # While Mikkel's sleep mode is on the display stays off in an active room, unless the main spots are on:
  # the lights app does not switch them on in sleep mode, so on means the wall switch. Sleep mode is also
  # the night face: the display shows the clock and the alarm line only, and a touch wakes it to that.
  sleep_entity: input_boolean.mikkel_sleep_mode
  light_entity: light.bathroom_main_lights
  # Mikkel's routes (TransitMikkel in apps/transit/transit_alarm.yaml) by the sensors TransitStatus
  # writes. A route whose status is Delayed or Disrupted becomes a line before the rows; Unavailable
  # (the API failed) is not a transit problem and shows nothing. Data older than transit_max_age_min
  # is ignored; the poller runs every 30 minutes at night.
  transit:
    - {entity: sensor.transit_enghave_metro_kbh, label: Metro}
    - {entity: sensor.transit_carlsberg_stog_kbh, label: S-tog}
  transit_max_age_min: 45
  # The display fires play_event when its round play button is tapped. The speaker then pauses if it is
  # playing, plays on if it is paused and otherwise starts radio as music, after leaving its group first
  # when it is grouped with another speaker.
  play_event: esphome.bathroom_display_play
  speaker: media_player.bathroom
  radio: "dr_podcasts://radio/p3"
  # The scale claims a weighing for Mikkel only while his phone is in the bathroom, and then updates these
  # three together. measured_entity changing to a moment at most 120 s old while the room is active
  # identifies him for the visit and shows the weighing card for 90 s: weight and fat, then the change in
  # fat mass and in the rest since 30 days ago (the recorder's hourly mean nearest to that day, within 3
  # days; a change of at most 0,3 kg reads "±0 kg"). The card uses only readings the weighing updated.
  measured_entity: sensor.mikkel_last_measurement
  weight_entity: sensor.mikkel_weight
  body_fat_entity: sensor.mikkel_body_fat
  # On the way out, 06:00-12:00: "Regner nu" while the roof station's piezo sensor is on, else the first run
  # of forecast hours with rain in the next 4 hours ("Regn 09-11", or "Regn fra 09" when it goes on past
  # them). The hourly forecast is fetched at most every 30 minutes, and only while it is wanted.
  rain_entity: binary_sensor.gw2000a_rain_state_piezo
  weather_entity: weather.forecast_home
  # The wake-up alarm line, 20:00-02:00 and all through sleep mode. Tapping it on the display fires
  # alarm_event, which toggles alarm_entity.
  alarm_entity: input_boolean.wakeup_bedroom
  alarm_time_entity: input_datetime.wakeup_bedroom
  alarm_event: esphome.bathroom_display_alarm
