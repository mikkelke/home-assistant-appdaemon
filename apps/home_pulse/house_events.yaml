# HouseEvents - apartment-level "why did the house just do that" feed (sensor.house_events)
# for the dashboard's Home activity card. Two inputs: appliance milestone observation (below)
# and `house_events_report` events fired by the automation apps themselves (cause -> effect).
# Observer only: controls nothing. See house_events.py header for shape and persistence caveats.
HouseEvents:
  module: house_events
  class: HouseEvents
  feed_entity: sensor.house_events
  appliances:
    sensor.washer_state: Washer
    sensor.dishwasher_state: Dishwasher
    sensor.dryer_state: Dryer
  # Lock feed entries read from the BLE entity (authoritative - see yale-lock notes);
  # "by <name>" enrichment comes from the cloud twin's changed_by when fresh.
  locks:
    lock.yale_bt: Apartment door
  lock_attribution:
    lock.yale_bt: lock.yale
  lock_door: binary_sensor.apartment_door_open
  # Rows worked out afterwards from the recorder (house_events_backfill.json on the box, not in git).
  backfill_entity: sensor.house_events_backfill
  # Who came in or went out: names the apartment-door row of that opening, or adds its own.
  door_entry: sensor.door_entry
  # One "Night mode on" row per night, and one "Went to bed" row per sleeper per night, seen by
  # that sleeper only (admin_sleepers: admins only), left out when it fell with the night row.
  night_entity: input_boolean.house_night_mode
  sleepers:
    input_boolean.mikkel_sleep_mode: Mikkel
    input_boolean.kristine_sleep_mode: Kristine
    input_boolean.claudia_sleep_mode: Claudia
  admin_sleepers: [Mikkel]
