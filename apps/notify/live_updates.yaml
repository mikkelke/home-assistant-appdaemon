# Ongoing cards for Android Live Updates and iOS Live Activities. Every send uses the same tag;
# existing finish/ring/ready notifications remain the responsibility of the source apps.
LiveUpdates:
  module: live_updates
  class: LiveUpdates
  dependencies:
    - MobileNotifier

  # People resolve through MobileNotifier.device_mapping. Nobody outside this list receives even
  # a cleanup message. Add Kristine/Claudia here to enable their iPhone Live Activities.
  enabled_people: [mikkel]

  # Laundry goes to started_by, including late attribution. Until that is known, the audience is
  # enabled people home when this app first sees the cycle (nobody if none). It stays fixed for
  # that cycle, including reloads; the first named starter replaces that audience once.
  washer_entity: sensor.washer_state
  dryer_entity: sensor.dryer_state

  # Independent bath/probe cards support cooking both at once. Coffee's published brewing phase
  # includes heating; eta appears when the source has an estimate. Finished phases clear the card.
  cook_entity: sensor.cook_state
  coffee_entity: sensor.coffee_state
  cook_people: [mikkel]
  coffee_people: [mikkel]

  # Only the apartment door has a doorbell card, tagged live_doorbell_apartment; tapping it opens the existing
  # dashboard ring view. Yale's apartment bell has no published visit end: retain its ring pulse until
  # doorbell_max_s. A street-door ring already gets a real push from the intercom apps, so it gets no card;
  # doorbell_entity (AbbWelcomeBridge's open street-door visits) is read only to match such a ring to a courier,
  # see delivery_entity.
  doorbell_entity: sensor.intercom_visit
  apartment_entity: binary_sensor.yale_doorbell_ding
  doorbell_people: [mikkel]
  doorbell_max_s: 180

  # HomeDelivery's sensor.home_delivery: one card per source (Wolt, Nemlig, and the parcel carriers Airmee,
  # PostNord, GLS) for its next active delivery, cleared when delivered. A parcel has a card only while it is
  # out for delivery. A cancelled Wolt order also sends one real push through MobileNotifier, category
  # delivery. Only food concerns the household: Kristine orders on Mikkel's Wolt account, while Nemlig and
  # parcels are Mikkel's own errands. Each audience is cut down to enabled_people, so Kristine gets Wolt
  # cards (and the cancel push) once she is listed there, and never a Nemlig or parcel card.
  # A street-door ring while sensor.home_delivery names a door_courier (the delivery a ring most likely
  # brings) takes that delivery's card away, since the courier is here. An apartment-door ring within ten
  # minutes of such a ring says "Probably the GLS courier" (or Wolt, Nemlig, ...) instead of how long ago it rang.
  delivery_entity: sensor.home_delivery
  delivery_food_people: [mikkel, kristine]
  delivery_groceries_people: [mikkel]
  delivery_parcel_people: [mikkel]

  # Unknown/unavailable sources retain their last card for this long. The apartment doorbell also obeys its
  # shorter hard maximum. Source recovery resumes reconciliation; an explicit end clears at once.
  stale_limit_s: 600

  # One quiet channel for every ongoing card. Existing channel settings on Android remain under
  # the phone user's control. Updates also carry alert_once and no sound field.
  channel: Live updates

  # Durable cycle audiences, last cards and send times survive reloads. Default beside this app;
  # use a writable persistent path when overriding. No credentials are written here.
  # state_file: /conf/apps/notify/live_updates_state.json
