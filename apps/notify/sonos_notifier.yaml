# /conf/apps/notify/sonos_notifier.yaml
# Configuration for the Sonos Notification App

SonosNotifier:
  module: sonos_notifier
  class: SonosNotifier
  log: sonos_notifier_log # Must match the log name in appdaemon.yaml

  # --- Sleep Mode Configuration ---
  kristine_sleep_mode_entity: "input_boolean.kristine_sleep_mode"

  mikkel_sleep_mode_entity: "input_boolean.mikkel_sleep_mode"
  claudia_sleep_mode_entity: "input_boolean.claudia_sleep_mode"
  
  # --- Speaker Configuration (room entities per TTS target group) ---
  # Kept in sync with the `tts:` tags in config/sonos_speakers.yaml by scripts/check_speakers.py.
  # Rooms are named by their Music Assistant entity; the clip plays on the native <room>_2 twin.
  tts_group_all:                  # no one sleeping
    - media_player.living_room
    - media_player.kitchen
    - media_player.dining_room
    - media_player.bedroom
    - media_player.bathroom
    - media_player.guest_bathroom
    - media_player.kristines_room
    - media_player.claudias_room
    - media_player.rooftop
  tts_group_family_rooms:         # always included when anyone sleeps
    - media_player.living_room
    - media_player.kitchen
    - media_player.dining_room
    - media_player.bathroom
    - media_player.guest_bathroom
    - media_player.rooftop
  tts_group_kristine:             # add when Kristine is awake
    - media_player.kristines_room
  tts_group_ms:                   # add when Mikkel is awake
    - media_player.bedroom
  tts_group_claudia:              # add when Claudia is awake
    - media_player.claudias_room

  # --- TTS Configuration ---
  default_chime_path: "/config/www/chimes/alert_notification.mp3"
  # chime_tts.say_url renders chime + speech with cache on; the clip is then played as a
  # Sonos audio clip on the target rooms' native entities.
  tts_platform: "piper"  # Use unprefixed name; chime_tts expects "piper"
  # chime_tts returns the clip on HA's external URL. The speakers fetch it here instead, over
  # plain HTTP on the LAN rather than through the public address and TLS.
  clip_base_url: "http://10.21.0.5:8123"
  # FFmpeg arguments chime_tts applies to every rendered clip: a fixed gain to about -14 LUFS,
  # 2 dB below DR P3's loudness, with a limiter on the chime's peaks. loudnorm is avoided: it flattens the voice.
  audio_conversion: "-af volume=2dB,alimiter=limit=0.89:attack=5:release=50:level=false"
  # Fractions (0.0-1.0). Without a volume_level from the caller, a room announces this much above
  # its own volume, at most announce_volume_cap. An explicit volume_level is used as given.
  announce_volume_boost: 0.0
  announce_volume_cap: 0.30

  # --- Pre-rendered announcements ---
  # Every fixed sentence an app hands to notify(), templated ones written out in full. precache()
  # renders each with every voice that may announce it (AssistTtsFailover's primary and fallback)
  # precache_delay_s after startup and whenever the primary server is back, one render every
  # precache_gap_s, so chime_tts has the clip cached before it is needed. A sentence has to match
  # byte for byte. A test fails when a literal sentence passed to notify() anywhere in apps/ is
  # missing here.
  precache_delay_s: 60
  precache_gap_s: 2
  precache_messages:
    # Fire safety
    - "Smoke is building in the kitchen"
    - "Smoke has been detected in the kitchen. Please check the kitchen now."
    - "The kitchen alarm has been silenced."
    - "The kitchen alarm has reset. All clear."
    - "Kitchen smoke alarm stopped reporting during the alarm — check the kitchen"
    # Intercom: the ring, the ring with the door opened
    - "Someone is at the front door"
    - "Someone is at the back door"
    - "Someone is at the apartment door"
    - "Someone is at the front door and I opened the front door"
    - "Someone is at the back door and I opened the back door"
    # Intercom: a courier is due (street ring, with and without the door opened, then the apartment door)
    - "The food is here."
    - "The groceries are here."
    - "A parcel is probably here."
    - "Mikkel's food is here."
    - "Mikkel's groceries are here."
    - "A parcel for Mikkel is probably here."
    - "The food is here. I opened the front door."
    - "The groceries are here. I opened the front door."
    - "A parcel is probably here. I opened the front door."
    - "Mikkel's food is here. I opened the front door."
    - "Mikkel's groceries are here. I opened the front door."
    - "A parcel for Mikkel is probably here. I opened the front door."
    - "The food is here. I opened the back door."
    - "The groceries are here. I opened the back door."
    - "A parcel is probably here. I opened the back door."
    - "Mikkel's food is here. I opened the back door."
    - "Mikkel's groceries are here. I opened the back door."
    - "A parcel for Mikkel is probably here. I opened the back door."
    - "The food is at the door."
    - "The groceries are at the door."
    - "The parcel is at the door."
    # Washer, dryer and dishwasher
    - "Washer is ready to be emptied"
    - "Drum clean is done. Open the washer door to air it"
    - "Dryer is ready to be emptied"
    - "Dishwasher is ready to be emptied"
    # Living room TV lift
    - "TV moving to living room"
    - "TV moving to kitchen"
    # Rain with a terrace door open
    - "Rain detected and the living room terrace door is open. Please close it."
    - "Rain detected and Claudia's terrace door is open. Please close it."
    - "Rain detected and both terrace doors are open. Please close them."

  # --- Time Constraints (using Home Assistant input_datetime helpers) ---
  # Notifications will only be sent *after* quiet_hours_end_entity 
  # AND *before* quiet_hours_start_entity.
  # Ensure these input_datetime helpers are configured in Home Assistant.
  quiet_hours_end_entity: "input_datetime.quiet_hours_end"      # e.g., when notifications can START (07:30)
  quiet_hours_start_entity: "input_datetime.quiet_hours_start"  # e.g., when notifications should STOP (22:00)

  # Fail-safe defaults used only when the helpers above are unavailable/unparseable
  # (e.g. briefly after every HA restart).
  default_quiet_hours_start: "22:00"
  default_quiet_hours_end: "07:00"
