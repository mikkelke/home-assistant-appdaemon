# /conf/apps/notify/sonos_notifier.yaml
# Configuration for the Sonos Notification App

SonosNotifier:
  module: sonos_notifier
  class: SonosNotifier
  log: sonos_notifier_log # Must match the log name in appdaemon.yaml

  # --- Sleep Mode Configuration ---
  kristine_sleep_mode_entity: "input_boolean.kristine_sleep_mode"

  mikkel_sleep_mode_entity: "input_boolean.mikkel_sleep_mode"
  claudia_sleep_mode_entity: "input_boolean.claudia_sleep_mode"
  
  # --- Speaker Configuration (room entities per TTS target group) ---
  # Kept in sync with the `tts:` tags in config/sonos_speakers.yaml by scripts/check_speakers.py.
  # Rooms are named by their Music Assistant entity; the clip plays on the native <room>_2 twin.
  tts_group_all:                  # no one sleeping
    - media_player.living_room
    - media_player.kitchen
    - media_player.dining_room
    - media_player.bedroom
    - media_player.bathroom
    - media_player.guest_bathroom
    - media_player.kristines_room
    - media_player.claudias_room
    - media_player.rooftop
  tts_group_family_rooms:         # always included when anyone sleeps
    - media_player.living_room
    - media_player.kitchen
    - media_player.dining_room
    - media_player.bathroom
    - media_player.guest_bathroom
    - media_player.rooftop
  tts_group_kristine:             # add when Kristine is awake
    - media_player.kristines_room
  tts_group_ms:                   # add when Mikkel is awake
    - media_player.bedroom
  tts_group_claudia:              # add when Claudia is awake
    - media_player.claudias_room

  # --- TTS Configuration ---
  default_chime_path: "/config/www/chimes/alert_notification.mp3"
  # chime_tts.say_url renders chime + speech with cache on; the clip is then played as a
  # Sonos audio clip on the target rooms' native entities.
  tts_platform: "piper"  # Use unprefixed name; chime_tts expects "piper"
  # chime_tts returns the clip on HA's external URL. The speakers fetch it here instead, over
  # plain HTTP on the LAN rather than through the public address and TLS.
  clip_base_url: "http://10.21.0.5:8123"
  # FFmpeg arguments chime_tts applies to every rendered clip: a fixed gain to about -12 LUFS,
  # DR P3's loudness, with a limiter on the chime's peaks. loudnorm is avoided: it flattens the voice.
  audio_conversion: "-af volume=4dB,alimiter=limit=0.89:attack=5:release=50:level=false"
  # Fractions (0.0-1.0). Without a volume_level from the caller, a room announces this much above
  # its own volume, at most announce_volume_cap. An explicit volume_level is used as given.
  announce_volume_boost: 0.01
  announce_volume_cap: 0.30

  # --- Time Constraints (using Home Assistant input_datetime helpers) ---
  # Notifications will only be sent *after* quiet_hours_end_entity 
  # AND *before* quiet_hours_start_entity.
  # Ensure these input_datetime helpers are configured in Home Assistant.
  quiet_hours_end_entity: "input_datetime.quiet_hours_end"      # e.g., when notifications can START (07:30)
  quiet_hours_start_entity: "input_datetime.quiet_hours_start"  # e.g., when notifications should STOP (22:00)

  # Fail-safe defaults used only when the helpers above are unavailable/unparseable
  # (e.g. briefly after every HA restart).
  default_quiet_hours_start: "22:00"
  default_quiet_hours_end: "07:00"
