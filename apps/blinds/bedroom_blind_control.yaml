# ============================================================================
# READ THIS FIRST - the position numbers here are INVERTED vs Home Assistant.
#
# cover.bedroom_blind ("Bedroom curtain") is a BOTTOM-UP blackout curtain: dark
# textile on the inside of the window that travels from the bottom edge upward.
# Fully extended (fabric all the way up) = window COVERED = position 100.
# Retracted at the bottom = window CLEAR = position 0.
#
# Home Assistant's cover convention is the opposite (0 = closed, 100 = open) and
# it computes is_closed as "position == 0". So while the curtain is fully drawn,
# HA reports  state: "open", current_position: 100.  That is not a bug and it is
# not stale - it is the device's frame of reference disagreeing with HA's.
#
# Consequences when reading history or debugging:
#   * NEVER conclude "the curtain was never closed" from state == "open".
#     Read current_position and the DIRECTION of travel instead.
#   * 38 -> 100 means closing.  100 -> 38 means opening to the partial position.
#   * The state string literally cannot change here: this curtain never parks at
#     0, so it reads "open" 24/7.
#
# Cost of forgetting: 2026-07-28, an investigation of "did the curtain close at
# bedtime?" concluded it had not, because HA said "open" all night. It had - at
# 22:28, 38% -> 100% over 37 s, via a held wall-remote button.
#
# ---------------------------------------------------------------------------
# 2026-07-28: there are now TWO entities per window. Know which one you want.
#
#   cover.bedroom_blind    "Bedroom curtain motor (raw, inverted)"
#       The motor as HA sees it. 100 = covered. THIS is what these apps command,
#       and every position in this file is in its frame. Not exposed to voice.
#
#   cover.bedroom_curtain  "Bedroom curtain"   (template, in templates.yaml on the box)
#       True orientation: 0 = covered = state "closed". What humans, dashboards,
#       history and the voice assistants see. Do NOT command it from these apps -
#       it only proxies to the raw entity, so driving both is pointless and makes
#       traces harder to read.
#
# Why the layer exists: cover.close_cover on the RAW entity drives toward the
# motor's closed limit, which on these bottom-up blinds UNCOVERS the window -
# verified 2026-07-28 (close_cover moved it 38 -> 26, i.e. toward clear). Voice was
# therefore backwards: "close the bedroom curtain" opened it. These apps were never
# affected because they only ever call set_cover_position, never open/close.
#
# The real fix is reversing the motor's rotational direction, which on Motionblinds/
# Brel motors is a physical button sequence on the motor head - NOT available in the
# Brel Home app (that only sets end limits). If that is ever done, every number in
# this file inverts (100 -> 0, 38 -> 62, 95 -> 5) and the template layer should be
# deleted rather than kept.
# ============================================================================
bedroom_blind_control:
  module: bedroom_blind_control
  class: BedroomBlindControl
  log: bedroom_blind_control_log

  # Z-Wave remote configuration (from HA automation provided)
  device_id: "fde0ce72582c723f4d8b729b522fc2fa"
  zwave_command_class: 91
  zwave_endpoint: 0

  # Scene keys and event mapping
  # Hold moon -> property_key "001" -> fully closed (100)
  property_key_close: "001"
  close_position: 100
  # Hold people -> property_key "002" -> partial (38)
  property_key_partial: "002"
  partial_position: 38
  bathroom_partial_position: 40
  event_value_held: "KeyHeldDown"
  # Partial position matching tolerance (used when deciding if bedroom is at partial before closing)
  partial_match_tolerance: 2
  # Threshold for considering a blind "closed" (handles low battery cases where blind stops at 99%)
  # Default: 95 (so 95% and above is considered "closed")
  closed_threshold: 95
  # Delay for sequential state checking to avoid race conditions (seconds)
  state_check_delay: 0.1
  # Delay before verifying position after service call (seconds)
  # Seconds to wait before checking the blind actually reached the commanded
  # position. Measured 2026-07-27: this motor travels ~0.6 s per percent (38% ->
  # 100% took 37 s), so the old 2.0 s fired while the blind was still moving and
  # reported "low battery or motor issue" on EVERY full close - 99 false warnings
  # in the logs, which is exactly how a real motor fault would get ignored. Must
  # exceed the full-range travel time (~60 s) with margin.
  verification_delay: 70.0

  # Target cover entity
  target_cover: "cover.bedroom_blind"
  # Optional: also close bathroom blind when bedroom blind is already at 100 and close-hold is triggered
  bathroom_blind_entity: "cover.bathroom_blind"

  # Bedroom-blind writes route through the single owner (bedroom_blind_owner.yaml)
  # as the "manual" rank - always wins, and starts the shared manual pause. When
  # the owner app is missing/broken this app writes directly, exactly as before.
  # The bathroom blind is not owned and is always written directly.
  owner_app: BedroomBlindOwner


