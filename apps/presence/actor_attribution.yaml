# /conf/apps/presence/actor_attribution.yaml
# Answers "who did this" for appliance monitors (washer/dishwasher/dryer): directly, when
# the action carries HA's own context.user_id (a dashboard-issued service call, e.g.
# input_button.press), else "who was home at time T, if exactly one person was" - a
# physical button press carries no HA context_user_id, so sole-occupancy is the only free
# signal for those. NEVER GUESS: ambiguous presence always returns unknown (see
# actor_attribution.py's module docstring for the full seven-rule decision table). A
# wrong attribution poisons an appliance's per-person history/learning forever; a missing
# one is just a blank, and recoverable the next time the signal is clean.
#
# Phase 2 (filled): attribute() tries _by_dashboard_action() first (self._user_id_to_person,
# built from person_entities' own user_id attribute below, plus user_id_overrides) and only
# falls back to _by_sole_occupancy() when no id was given or it doesn't resolve - see
# actor_attribution.py's module docstring.
#
# Phase 3 (filled): with 2+ people home and every other check passed, room elimination crosses
# off each home resident whose private room (private_rooms below) was occupied from
# room_lead_seconds before the event through room_hold_seconds after it. One resident left is
# named, none left is room_contradiction. A verdict asked for sooner than room_hold_seconds +
# 30 s after the event never names anyone and carries pending_until while a name is still
# possible. A future BLE-presence signal remains a possible further method, ahead of room
# elimination. See actor_attribution.py's module docstring.
#
# Known residual: an untracked human physically in the flat (a guest, a cleaner, a kid's
# friend, or one of the three people below without their phone/location on) is invisible
# to person.* state and can produce a false sole-occupant verdict. Not closed by this app.
#
# No `dependencies:` key on purpose - appliance monitors resolve this app lazily per call
# via get_app(), not at their own initialize() time, so init order relative to this app
# does not matter.

ActorAttribution:
  module: actor_attribution
  class: ActorAttribution
  person_entities:
    - person.mikkel
    - person.kristine
    - person.claudia
  door_entity: binary_sensor.apartment_door_open
  stability_seconds: 600
  door_settle_seconds: 300
  retention_hours: 26
  # Person key -> room_active entity of that resident's private room. A resident missing
  # here is never crossed off; empty disables room elimination.
  private_rooms:
    mikkel: binary_sensor.bedroom_active
    kristine: binary_sensor.kristines_room_active
    claudia: binary_sensor.claudias_room_active
  room_lead_seconds: 60
  room_hold_seconds: 360
  publish_sensor: sensor.household_actor
  # HA account id -> person key, for a resident whose person.*.user_id link is missing or
  # not (yet) made in Settings -> People - same override convention as
  # manual_override_timeout.yaml's user_name_fallback. Checked AFTER the automatic
  # person_entities resolution, so a real person.*.user_id link always wins once made;
  # this is only a gap-filler. Keys normalized to undashed lowercase hex, matching
  # context.user_id's own format. Empty by default - populate only if
  # sensor.household_actor's user_id_count attribute comes back short of the household
  # size.
  user_id_overrides: {}
