# Bed presence comparator (2026-08-12): the ESPHome pressure strip
# (bed_presence_6b9c94, hand-calibrated the day it was installed, zero nights of
# track record) rides along as an ADDITIONAL WITNESS in mikkel_sleep_mode,
# bedroom_lights and smart_cooling. This app produces the evidence for ever
# promoting it: it compares each strip sensor against its Withings mat, logs every
# disagreement with timestamps and durations (grep the app log for "BEDCMP" /
# "DISAGREEMENT"), and publishes sensor.bed_presence_agreement - per-side counters
# (edges_agreeing / strip_only / mat_only), edge-lag stats, per-night records, a
# nights_observed counter, and both-occupied episode/minute counts (the household's
# first honest second-sleeper signal; design data only, wired into nothing).
#
# NOTE: numbers in the published attributes are STRINGS - AppDaemon 4.5.13 drops
# attribute values equal to None/False/0 recursively, and "0 disagreements" is this
# sensor's most important message. The state file keeps real numbers.

BedPresenceCompare:
  module: bed_presence_compare
  class: BedPresenceCompare
  log: bed_presence_compare_log

  pairs:
    left:
      mat: binary_sensor.left_bedside
      strip: binary_sensor.bed_presence_6b9c94_bed_occupied_left
    right:
      mat: binary_sensor.right_bedside
      strip: binary_sensor.bed_presence_6b9c94_bed_occupied_right
  both_entity: binary_sensor.bed_presence_6b9c94_bed_occupied_both

  publish_entity: sensor.bed_presence_agreement

  # An edge on one sensor unmatched for longer than this is a real disagreement,
  # not lag. The mats are cloud-backed and routinely minutes behind, so this is
  # deliberately generous; the local strip should usually lead.
  lag_match_window_seconds: 600

  # A "night" = any overlap with this window; nights_observed only counts nights
  # the comparator was actually running (evidence, not calendar).
  night_window_start: "21:00"
  night_window_end: "09:00"

  # Five nights of evidence must survive deploys/restarts (atomic tmp+replace,
  # same convention as mikkel_sleep_mode_state.json).
  state_file: /conf/apps/presence/bed_presence_compare_state.json
  max_night_records: 21
  max_disagreement_records: 20
