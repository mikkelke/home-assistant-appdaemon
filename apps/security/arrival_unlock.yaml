# /conf/apps/security/arrival_unlock.yaml
# Unlocks the apartment door when the resident's phone reaches the landing, while that resident's
# unlock_switch is on, and locks it again after relock_s when the door was not opened. With the
# switch off it only measures. Either way it writes one JSON line per window (did the door open, how
# soon) and one per arrival that no window caught. See arrival_unlock.py's module docstring.
#
# No `log:` key on purpose: a named log stream must be declared in the box-only appdaemon.yaml
# first or the app fails to instantiate.

ArrivalUnlock:
  module: arrival_unlock
  class: ArrivalUnlock

  tracker: device_tracker.mikkels_ofx9p
  away_min: 10

  # The sighting is Bermuda's area sensor for the phone beacon changing to landing_area. The two
  # landing entity ids (landing_distance, landing_online) and the area name Landing are expected
  # names until the proxy is installed; the app waits for entities that do not exist yet.
  # landing_distance is optional and only logged at the sighting.
  landing_area_sensor: sensor.bermuda_d6462f88944242db9e31bdff598edc25_100_40004_area
  landing_area: Landing
  landing_distance: sensor.bermuda_d6462f88944242db9e31bdff598edc25_100_40004_distance_to_ble_proxy_landing
  landing_online: sensor.ble_proxy_landing_uptime

  lock: sensor.apartment_lock
  door: binary_sensor.apartment_door_open
  keypad: lock.yale

  window_s: 180

  unlock_switch: input_boolean.arrival_unlock_mikkel
  # Who the timeline's unlock row names.
  name: Mikkel
  unlock_lock: lock.yale_bt
  unlock_fallback: lock.yale
  relock_s: 60
  notify: notify.mobile_app_mikkels_ofx9p
  alarm_notify: notify.mobile_app_mikkels_ofx9p
  # Defaults to arrival_unlock_log.jsonl beside the module (*_log.jsonl is gitignored).
  # log_file: /conf/apps/security/arrival_unlock_log.jsonl

# Claudia's iPhone cannot transmit a beacon; Bermuda tracks it through its IRK (Private BLE Device).
ArrivalUnlockClaudia:
  module: arrival_unlock
  class: ArrivalUnlock

  tracker: device_tracker.claudias_iphone_2
  away_min: 10

  landing_area_sensor: sensor.claudias_iphone_ble_area
  landing_area: Landing
  landing_distance: sensor.claudias_iphone_ble_distance_to_ble_proxy_landing
  landing_online: sensor.ble_proxy_landing_uptime

  lock: sensor.apartment_lock
  door: binary_sensor.apartment_door_open
  keypad: lock.yale

  window_s: 180

  unlock_switch: input_boolean.arrival_unlock_claudia
  name: Claudia
  unlock_lock: lock.yale_bt
  unlock_fallback: lock.yale
  relock_s: 60
  notify: notify.mobile_app_claudias_iphone
  alarm_notify: notify.mobile_app_mikkels_ofx9p
  log_file: /conf/apps/security/arrival_unlock_claudia_log.jsonl

# Kristine's iPhone, same IRK route as Claudia's.
ArrivalUnlockKristine:
  module: arrival_unlock
  class: ArrivalUnlock

  tracker: device_tracker.kristines_iphone
  away_min: 10

  landing_area_sensor: sensor.kristines_iphone_ble_area
  landing_area: Landing
  landing_distance: sensor.kristines_iphone_ble_distance_to_ble_proxy_landing
  landing_online: sensor.ble_proxy_landing_uptime

  lock: sensor.apartment_lock
  door: binary_sensor.apartment_door_open
  keypad: lock.yale

  window_s: 180

  unlock_switch: input_boolean.arrival_unlock_kristine
  name: Kristine
  unlock_lock: lock.yale_bt
  unlock_fallback: lock.yale
  relock_s: 60
  notify: notify.mobile_app_kristine_iphone_2
  alarm_notify: notify.mobile_app_mikkels_ofx9p
  log_file: /conf/apps/security/arrival_unlock_kristine_log.jsonl
