# Every delivery on its way to the flat, as one entity: sensor.home_delivery. Wolt comes from the
# Wait for Wolt integration's entities (found by name, so a new venue needs no config); Nemlig is
# polled from the signed-in homepage's featured order: every 15 min, every 90 s from an hour before
# the booked window until delivered. Parcels come from the Parcel Aggregator's incoming and delivered
# sensors, one source per carrier, and are listed only when they matter today. See home_delivery.py
# for the published contract.
#
# The doorbell and intercom wording follows door_courier_kind: food while its courier is expected,
# Nemlig and parcels once one is out for delivery, whoever is home.
#
# Nemlig's login lives in /data/appdaemon/secrets.yaml on the box (nemlig_user, nemlig_pass); drop
# the two nemlig_* lines to track Wolt only. No `log:` key on purpose: a named log stream must be
# declared in the box-only appdaemon.yaml first or the app fails to instantiate.
#
# The carrier integrations poll slowly, so a street-door ring (sensor.intercom_visit) while door_courier
# is a parcel out for delivery presses that carrier's refresh button (source -> button entity) 3 and
# 6 minutes after the ring, skipping a press once the carrier has no undelivered parcel left. A carrier
# without a button is left alone; drop refresh_buttons and the intercom is not read at all.

HomeDelivery:
  module: home_delivery
  class: HomeDelivery
  entity: sensor.home_delivery
  nemlig_user: !secret nemlig_user
  nemlig_pass: !secret nemlig_pass
  refresh_buttons:
    airmee: button.airmee_refresh
    postnord: button.postnord_refresh
    gls: button.gls_refresh
