# Weather opening alert – rain + wind-driven window exposure + rooftop doors.
# Publishes synthetic entities weather_opening_alert_* via set_state (see README.md).

WeatherOpeningAlert:
  module: weather_opening_alert
  class: WeatherOpeningAlert
  log: weather_opening_alert_log
  # Init-order guarantee for get_app("SonosNotifier")/get_app("MobileNotifier") cached
  # in initialize() (rooftop-rain announce + push); also reloads this app when either
  # notifier reloads.
  dependencies:
    - SonosNotifier
    - MobileNotifier

  rain_rate_entity: sensor.gw2000a_rain_rate_piezo
  wind_speed_entity: sensor.gw2000a_wind_speed
  wind_gust_entity: sensor.gw2000a_wind_gust
  wind_direction_entity: sensor.gw2000a_wind_direction
  # The facade bands below are tested against the station's 10-MINUTE MEAN direction, not the
  # instantaneous vane (2026-08-12). Over the previous 60 days the vane sat a median 26 deg
  # from that mean and p90 114 deg - wider than a whole +/-30 band - so requiring 4 unbroken
  # minutes in-band filtered turbulence rather than weather. Replayed on the mean, the ENE
  # facade gets 92 qualifying minutes instead of 50, alerts land up to 12 min earlier, two
  # missed episodes appear, and the rarely-blowing SSE/NNW sectors get FEWER in-band minutes
  # (spurious single-sample excursions drop out). The vane stays as the fallback.
  wind_direction_mean_entity: sensor.gw2000a_wind_direction_10m_avg

  # 0.5 mm/h is "any measurable rain": the piezo rate quantises in 0.6 mm/h steps, and unlike
  # binary_sensor.gw2000a_rain_state_piezo (an impact detector - see darkness_calculator.yaml)
  # every non-zero rate reading in 60 days was corroborated by the rain accumulator.
  rain_rate_min_mmh: 0.5
  wind_speed_min_kmh: 5
  wind_gust_min_kmh: 10
  exposure_band_degrees: 30

  rooftop_rain_sustain_minutes: 2
  rooftop_rain_clear_minutes: 1
  window_rain_sustain_minutes: 4
  window_rain_clear_minutes: 2
  # Require contact open this long before it counts toward window-rain (0 = immediate).
  # Use 1–2 if you want fewer alerts right after opening a window while rain/wind already qualify.
  opening_open_minutes: 2

  evaluate_debounce_seconds: 5

  room_priority:
    - living_room
    - kitchen
    - dining_room
    - bathroom
    - bedroom
    - kristines_room

  openings:
    - entity_id: binary_sensor.bathroom_window_contact
      bearing: 70
      rooftop: false
      area: bathroom
    - entity_id: binary_sensor.bedroom_window_contact
      bearing: 70
      rooftop: false
      area: bedroom
    - entity_id: binary_sensor.dining_room_window_1_contact
      bearing: 70
      rooftop: false
      area: dining_room
    - entity_id: binary_sensor.living_room_window_contact
      bearing: 155
      rooftop: false
      area: living_room
    - entity_id: binary_sensor.kitchen_window_contact
      bearing: 155
      rooftop: false
      area: kitchen
    - entity_id: binary_sensor.dining_room_window_2_contact
      bearing: 155
      rooftop: false
      area: dining_room
    - entity_id: binary_sensor.dining_room_window_3_contact
      bearing: 155
      rooftop: false
      area: dining_room
    - entity_id: binary_sensor.kristines_room_window_contact
      bearing: 335
      rooftop: false
      area: kristines_room
    # name: spoken/pushed as-is when this door is open in rain (user 2026-08-07:
    # door 1 = living room, door 2 = Claudia's).
    - entity_id: binary_sensor.rooftop_door_1_contact
      bearing: 245
      rooftop: true
      area: rooftop
      name: the living room terrace door
    - entity_id: binary_sensor.rooftop_door_2_contact
      bearing: 245
      rooftop: true
      area: rooftop
      name: Claudia's terrace door
