# /conf/apps/intercom/intercom.yaml

Intercom:
  module: intercom
  class: Intercom
  log: intercom_log
  # Init-order guarantee for get_app("SonosNotifier")/get_app("MobileNotifier") cached in initialize(); also reloads this app when either notifier reloads.
  dependencies:
    - SonosNotifier
    - MobileNotifier

  # Sensors
  front_sensor: "binary_sensor.intercomproxy_doorbell_front_door"
  back_sensor: "binary_sensor.intercomproxy_doorbell_back_door"
  apt_sensor: "binary_sensor.yale_doorbell_ding"

  # ABB station ids of the two street doors. A street ring triggers from whichever of the ABB
  # SIP ring and the ESP sensor above arrives first; the other is debounced.
  abb_front_station: "100000002"
  abb_back_station: "100000001"

  # Locks
  front_lock: "lock.intercomproxy_front_door"
  back_lock: "lock.intercomproxy_back_door"

  # Door state sensors (optional - if door is already open, skip unlock)
  # front_door_sensor: "binary_sensor.front_door_contact"  # Uncomment and set if available
  # back_door_sensor: "binary_sensor.back_door_contact"    # Uncomment and set if available

  # Auto-open guard
  auto_open_boolean: "input_boolean.auto_open_intercom"

  # Messages
  tts_message_front: "Someone is at the front door"
  tts_message_back: "Someone is at the back door"
  tts_message_apt: "Someone is at the apartment door"
  door_open_message_front: "I opened the front door"
  door_open_message_back: "I opened the back door"

  # While sensor.home_delivery's door_courier_kind says a courier is due (food, Nemlig or a parcel),
  # a street ring says "The food is here." and the like instead of the messages above, and an
  # apartment-door ding within 10 minutes of such a ring says the courier is at the door. Only the
  # words change. owner_entity decides whether the delivery is named as Mikkel's ("Mikkel's food is
  # here."), which it is while he is away.
  delivery_entity: "sensor.home_delivery"
  owner_entity: "person.mikkel"

  # ESP unlock: up to unlock_repeat_count attempts at 1s, 4s, 7s, each 3 s long.
  # The ladder stops at the first attempt the ESP confirms, so a working door
  # gets one unlock and one module announcement. The first attempt waits a
  # moment on purpose: a door that buzzes the instant the bell is pressed feels
  # wrong to the visitor.
  unlock_delay_s: 1
  unlock_repeat_count: 3
  unlock_repeat_interval_s: 3

  # Debounce rapid retriggers
  debounce_s: 5

  # Mobile alert target when all unlock attempts of a ring fail
  notify_target: "mikkel"

  # A ring matched to a courier of this kind tells these people instead (Kristine orders food on Mikkel's
  # Wolt account).
  courier_notify:
    food: [mikkel, kristine]

  # Reboot-survival resume window (intercom_state.json): how stale a persisted
  # "rang but auto-open unlock was never confirmed" record can be at startup and
  # still be worth alerting on. Older than this, the visitor is long gone - alerting
  # would just be noise, so the record is discarded silently instead. Alert-only:
  # this never re-attempts an unlock from initialize().
  resume_alert_max_age_s: 60

  # --- ABB-native unlock experiment (2026-08-25) -----------------------------
  # Today the street door is opened by the ESP32 bus module (front_lock/back_lock
  # above). This lets HA open it instead, via the ABB Welcome integration's own
  # button entity - HA is already the answering party on the SIP call, so it MIGHT
  # keep the call up instead of the ~0.25s-later hangup the ESP's bus-level open
  # causes today (which cuts the ring video recording short). Unproven - this is
  # the experiment. abb_unlock_doors maps a door label (must match one of the
  # ring_label values built into trigger_map above, e.g. "front door") to the ABB
  # button entity to press INSTEAD of the ESP unlock sequence for that door; the
  # ESP stays the fallback - and the ONLY physical confirmation a door actually
  # opened (the ABB portal has never once reported a door-open event) - via an ack
  # watchdog: if the ESP lock does not publish unlocking/unlocked within
  # abb_unlock_ack_timeout_s of the ABB press, intercom.py falls through to the
  # unchanged ESP retry ladder. Net effect of an ABB failure: the visitor waits
  # ~abb_unlock_ack_timeout_s longer; they are never locked out.
  #
  # FRONT DOOR ONLY. button.abb_welcome_gateway_outdoor_station_2_1 (front door,
  # station 100000002) takes the integration's "fast" unlock route - a standalone
  # SIP MESSAGE, no second call, so it cannot collide with a ring recording.
  # button.abb_welcome_gateway_outdoor_station_1_1 (back door, station 100000001)
  # takes the "standard" route instead, which places its OWN SIP INVITE - a second
  # call that WOULD kill the recording. Do not add the back door here.
  #
  # Default {} = exactly today's behaviour, a no-op: no extra listen_state
  # registrations, no new branch touched by _handle_trigger. Enabling this for a
  # door changes how a shared street door opens for every apartment on the
  # building's intercom bus, not just this flat - flip it deliberately.
  # ENABLED 2026-08-25 for the supervised trial: Mikkel tests on arrival by pressing
  # Open on the dashboard (which now presses this same button) and by ringing his own
  # doorbell. Front door ONLY - station 100000002 takes the integration's "fast" unlock
  # route (a standalone SIP MESSAGE, no second call), while the back door's "standard"
  # route places its OWN INVITE and would kill an in-progress ring recording.
  # Set back to {} to return to ESP-only opening.
  abb_unlock_doors:
    front door: "button.abb_welcome_gateway_outdoor_station_2_1"
    # No back door: station 100000001 is not the default unlock door, so its
    # button places its own call, which the station refuses while it rings.
    # It unlocks only inside a call HA already holds with that station.

  # How long to wait for the ESP lock's own unlocking/unlocked ack after an ABB
  # button press before giving up on it and falling back to the ESP sequence.
  abb_unlock_ack_timeout_s: 2.5

  # Back door only. When ESP unlock attempt 1 of a ring is not confirmed, ask the ABB integration
  # to unlock inside the call HA already holds with this station; it sends nothing when there is
  # no such call. The ESP attempts carry on, and one that finds the lock already unlocking after
  # the rescue does not pulse again. Empty or absent = off.
  abb_rescue_back_station: "100000001"

  # ring -> recording -> announcement -> unlock. The visitor stands in front of
  # the intercom only until the door opens; this gateway needs ~2 s to produce
  # a first video frame while the unlock used to fire at ~+0.45 s, so opening
  # immediately guaranteed a clip of an empty doorstep - the original complaint
  # that started this whole project. Speaking first buys the recording the
  # seconds it needs. Against the 15-30 s a human answering the intercom would
  # have taken, this is invisible to the visitor.
  voice_before_unlock:
    front door: "camera.abb_welcome_gateway_outdoor_station_2_1"
  # EMPTY on purpose: intercom.py holds the door, the bridge says the sentence
  # into the answered ring call. Two speakers would collide on the station's
  # single call slot.
  voice_before_unlock_message: ""
  voice_before_unlock_tts: "tts.piper"
  # CEILING, not a delay - the door opens when the sentence actually ends.
  # The bridge fires abb_announcement_spoken the instant play_audio returns,
  # and the integration only returns from it once the last 20 ms frame has left
  # (media_pipeline _play_talkback_frames paces the queue, then drains it).
  # This value is only reached when that never happens: the station's talkback
  # never became ready and every retry attempt failed. A rejected, silent or
  # hung announcement therefore still cannot leave the door shut.
  # 12 s leaves room for talkback that is slow to become ready and several
  # failed play attempts.
  # Replaced voice_before_unlock_wait_s (3.5 s), a fixed timer that happened to
  # land 0.8-1.7 s after the sentence - correct ordering by luck, not by rule.
  voice_before_unlock_ceiling_s: 12.0

