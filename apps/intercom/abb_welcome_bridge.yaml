# /conf/apps/intercom/abb_welcome_bridge.yaml
#
# Additive observer for the ABB Welcome integration - missed-call pushes with
# doorbell snapshots, the ring image/clip archive, the announce-after-unlock
# voice, the auto-open-off Open/Reject ring push with door voices, and the
# ABB/ESP comparators (rings + door-opens) that gather the phase-2 (ESP
# replacement) evidence. This app never presses buttons or toggles switches on
# the ABB device. Since 2026-08-13 it DOES use the media capabilities (announce
# TTS, arm_streaming + camera.record for ring clips), which dial the station
# but cannot open anything - and it unlocks a door in EXACTLY one case: a human
# pressed Open on the ring push, executed via the ESP lock entity, the same
# path as the dashboard's door buttons. Never on its own judgment. The ESP
# intercom app (intercom.yaml) stays authoritative for the doorbell and does
# NOT depend on this app - if this app dies, the house loses features, never
# the doorbell.

AbbWelcomeBridge:
  module: abb_welcome_bridge
  class: AbbWelcomeBridge
  # No custom `log:` stream on purpose: those must be declared in appdaemon.yaml, which lives
  # only on the box and is not in this repo - an undeclared stream fails instantiation on a
  # fresh deploy (it did, 2026-08-12, same trap as forecast_log three days earlier).
  # Only the notifier: intercom.py deliberately has NO dependency on this app
  # (an AppDaemon dependency would stop the doorbell app from loading if this
  # one broke), and this app resolves the notifier the same way intercom does.
  dependencies:
    - MobileNotifier

  # --- ABB entities (read-only) ---
  abb_event_entity: "event.abb_welcome_gateway_intercom"           # cloud-polled portal events (30 s interval)
  abb_ringing_sensor: "binary_sensor.abb_welcome_gateway_intercom_ringing"  # realtime SIP ring, 5 s hold
  abb_image_entity: "image.abb_welcome_gateway_latest_screenshot"  # gateway snapshot, reaches HA 18-25 s after the ring (6 samples, 2026-08-25..27)
  abb_ring_bus_event: "abb_welcome_ring"                           # realtime HA bus event from the integration's SIP listener

  # --- ESP side (observed only - never actuated from here) ---
  esp_door_sensors:
    binary_sensor.intercomproxy_doorbell_front_door: "front door"
    binary_sensor.intercomproxy_doorbell_back_door: "back door"
  esp_lock_doors:
    lock.intercomproxy_front_door: "front door"
    lock.intercomproxy_back_door: "back door"
  auto_open_boolean: "input_boolean.auto_open_intercom"

  # Station -> door mapping. Evidence (2026-08-12, two independent ring
  # correlations against the ESP sensors; see abb_welcome_bridge.py header):
  #   14:24:44Z back-door ESP ring  <-> station 100000001 "Outdoor Station 1-1"
  #   16:35:28Z front-door ESP ring <-> station 100000002 "Outdoor Station 2-1"
  # Labels only - the comparator's station_door_matrix keeps re-verifying this.
  station_doors:
    "100000001": "back door"
    "100000002": "front door"

  # --- timing knobs (defaults shown; all measured 2026-08-12) ---
  pair_window_s: 10            # ESP and ABB rings ~50 ms apart when both work; 10 s is generous
  debounce_s: 5                # per-side re-ring fold, matches intercom.py + the ABB 5 s ring hold
  episode_close_s: 75          # classification final: unlock by +9 s, missed/screenshot by ~+35 s (30 s poll)
  suppress_window_s: 30        # unlock within +/-30 s of the ring = the house answered; not a real miss
  missed_decision_delay_s: 15  # wait for unlock evidence (lands ~ring+9 s) before pushing "missed"
  missed_max_age_s: 900        # ignore replayed/stale portal events (HA restart restores the last one)
  snapshot_probe_s: 6          # early snapshot probe; the normal capture is event-driven off the image entity

  # --- doorbell photo timing (2026-08-27, Mikkel: "the image that is included
  # in the notifcation is at least a image delayed - the current notification
  # have the ring before that") ---
  #
  # The auto-open push goes out at ~ring+4 s; this ring's own gateway screenshot
  # reaches HA 18.0-24.6 s after the ring (six measured rings 2026-08-25..27), so
  # every push carried the PREVIOUS visitor. The attachment is now freshness-
  # gated on the same rule the archive has always used - a missing photo is
  # honest, the wrong person is misleading - and the push waits for the real one.
  #
  # ring_push_photo_wait_s: how long intercom.py's auto-open push is held waiting
  # for that photo before going out text-only. The push is a RECORD ("the door
  # was unlocked automatically"), not an alert - the Sonos announcement is what
  # tells the house in real time - so ~22 s buys the right face at no cost that
  # matters. Must stay well under episode_close_s (75). 0 = send immediately,
  # which is today's behaviour minus the stale image.
  #
  # Not tunable from here: the lag has a hard floor near 18 s across all six
  # samples, so it is mostly the gateway's upload to the ABB cloud rather than
  # the integration's poll cycle - an earlier poll would find nothing. And
  # homeassistant/update_entity is not even a lever: the image entity is a plain
  # ImageEntity listening to the coordinator, not a CoordinatorEntity, so it
  # never reaches async_request_refresh (tried and verified inert 2026-08-27).
  ring_push_photo_wait_s: 30

  # Missed-call push audience: everyone home, no category restriction.
  notify_target: "home"

  # Announce after auto-open (2026-08-13, restoring the policy agreed 2026-08-12 whose
  # box-direct deploy was lost to a repo sync): when a ring is answered by the house
  # opening the door, the door tells the visitor. FRONT ONLY - the back door reportedly
  # has a built-in voice, unverified; two overlapping voices are worse than none. Add
  # "back door" here only after standing at it during an auto-open.
  announce_after_unlock:
    front door: camera.abb_welcome_gateway_outdoor_station_2_1
  # "opening", not "open": there is a real gap between the sentence and the
  # click - the announcement has to finish, the unlock has to travel, and the
  # person then has to reach for the door. "The door is open." said before the
  # click is simply wrong, and said after it is a log entry read aloud. This
  # also matches what the back door's own hardware voice module says, so the
  # two doors tell the household the same thing in the same words.
  announce_message: "Door is opening."
  # Voices during a recording go THROUGH the recording's call (play_audio into the
  # open stream's talkback leg) using this TTS engine - so video and voice run
  # together instead of the voice being skipped. "" disables in-recording voices.
  voice_tts_entity: "tts.piper"
  # Which call the sentence lands in decides whether anyone hears it. The
  # station does NOT render audio on its own ring call (114 clean packets,
  # three human nulls at the door) but DOES on a call HA dialled. The
  # integration's continuation dial fires ~ring+8 s with media ~+10 s, so wait
  # for the ring call to be gone and let the attempts land there instead.
  # We answer the ring again, now that the answer negotiates AVPF like our own
  # working dial does - static analysis of the official app showed its "open
  # speak" is exactly that and nothing more. The answered call's talkback leg is
  # ready within ~0.03 s (measured 18:57:30.652 accept -> .676 leg ready), so
  # speak early; the retry chain covers the cases where it is not up yet.
  #
  # ANCHORED TO THE RING since 2026-08-27 (_arm_ring_voice), not to the unlock.
  # This delay used to be measured from the lock's own unlocking/unlocked edge,
  # which is the only thing that ever called _maybe_announce - so the sentence
  # could not physically start until after the door had already opened. That
  # ring: door open at +3.9 s, sentence dispatched at +7.0 s, and the station
  # hung up at +9.0 s. intercom.py's 3.5 s hold bought nothing at all. From the
  # ring the order is finally the one asked for: answer+record at +0.03 s,
  # sentence at +1.5 s (a short line runs ~1.5 s), unlock at +3.5 s.
  voice_start_delay_s: 1.5
  announce_cooldown_s: 90
  announce_ring_window_s: 60

  # --- ring video clips ---
  # RECORD AT THE RING (user 2026-08-19: "as soon as someone rings we start the
  # recording - we want to look at who they are no matter what path we continue
  # in"). The dial goes out the moment the episode opens, for BOTH doors, and
  # every voice (announce, ring-ack, reject) YIELDS while a recording is in
  # flight - the station has one call slot and speaking over a recording kills
  # its video (probed 2026-08-13). The no-answer message at +45 s is unaffected.
  #
  # The station's own ~5 s ring call can silently refuse the first record dial,
  # so the bridge confirms the camera actually entered "recording" at +10 s
  # (anchored to the dial, since the dial itself is offloaded to the executor -
  # camera.record blocks for the recording's own duration) and redials once.
  # Physical floor: dial + stream-open ~1-2 s; nothing before the dial can ever
  # be on video - the RING-MOMENT artifact is the gateway snapshot, which the
  # gallery pairs with the clip. (native_ring_clips=false / fallback path only.)
  #
  # native_ring_clips (2026-08-24): the ABB Welcome integration itself now records
  # the ring call video (from ~ring+0.3 s) and fires abb_welcome_ring_clip once the
  # mp4 is finalized (10-40 s after the ring; episode_close_s=75 above always
  # outlasts it). true = this bridge NEVER dials arm_streaming/camera.record
  # itself (the clip_cameras/clip_seconds/clip_delay_s keys below still
  # configure WHICH cameras/doors get clips and how they are named, just not
  # dialed) - it only listens for that event and attaches clip_filename to the
  # matching open episode. It also opens the self-call window at episode open
  # instead of at a dial WE placed, because the integration may place its own
  # continuation dial ~2.5 s after the ring call ends (to film the visitor
  # entering) - that shows up in the ABB portal as call-answered and must not be
  # misread as a real answer. The announce voice never places its own
  # temporary-call dial in this mode either (it would collide with the ring call
  # or the continuation dial) - it retries play_audio into whichever of those two
  # is open instead (up to 5 attempts, 2 s apart). false = every behaviour above
  # is exactly today's (the arm_streaming + camera.record fallback in
  # _start_clip, the temporary-call announce). Ships false-safe: absent this key
  # the code defaults to false, so a code deploy landing ahead of the
  # integration-side change is a no-op; set true only once that has actually
  # shipped (both land in the same deploy here).
  native_ring_clips: true
  clip_cameras:
    front door: camera.abb_welcome_gateway_outdoor_station_2_1
    back door: camera.abb_welcome_gateway_outdoor_station_1_1
  clip_seconds: 15
  clip_delay_s: 0
  clip_record_dir: "/config/www/abb_doorbell"  # archive_dir as HA's container sees it

  # --- auto-open-OFF ring fallback (2026-08-13, Mikkel: "The notification if auto
  # is not on should be with open or reject", door voices for wait/no-answer/reject).
  # With auto-open ON none of this runs. With it OFF: first ring of an episode ->
  # actionable push to everyone home (Open buzzes via the ESP lock, same path as the
  # dashboard buttons; Reject speaks reject_message at the door), the door hears
  # ring_ack_message ~2 s in, and no_answer_after_s of silence speaks
  # no_answer_message and withdraws the push. Any unlock (auto, dashboard, push)
  # kills the pending buttons everywhere so a late press cannot re-buzz. Voices go
  # only to doors in announce_after_unlock (back door still pending verification);
  # the push itself works for both doors. Set a message to "" to disable that voice.
  # The portal's own call-missed push is suppressed for these rings - the house
  # already saw them, and after a Reject "missed" would be plain wrong.
  ring_ack_message: "One moment, please."
  no_answer_message: "Sorry, no one can answer the door right now."
  reject_message: "Sorry, we cannot open the door right now."
  no_answer_after_s: 45     # < episode_close_s so the episode is still tracked
  ring_action_window_s: 180 # Open/Reject pressed later than this is ignored

  # --- integration health watchdog (2026-08-13, found live during the feature audit:
  # leaked stream-worker retries from failed camera.record attempts flipped the front
  # camera unavailable for 90 minutes; one reload_config_entry cured it). A dead SIP
  # listener means ABB is deaf while the ESP still hears - the comparator counts that
  # as rings_esp_only and phase 2 stalls on bad evidence. Self-heals by reloading the
  # ABB config entry after health_unhealthy_s of sustained trouble, at most once per
  # health_heal_cooldown_s, pushing Mikkel on each heal and on recovery. Explicit bad
  # states only - unreadable sensors hold, they never trigger a reload. The ESP
  # doorbell does not depend on any of this.
  health_sip_entity: "sensor.abb_welcome_gateway_sip_listener"
  health_unhealthy_s: 600
  health_heal_cooldown_s: 3600
  health_notify: ["mikkel"]

  # --- ring image archive (same exposure model as the vacuum's rober2_maps:
  # /www inside the container = /data/homeassistant/www on the box, served
  # unauthenticated on LAN at /local/abb_doorbell/) ---
  archive_dir: "/www/abb_doorbell"
  archive_url_prefix: "/local/abb_doorbell"
  retain_days: 90              # prune snapshots older than this on every write
  max_files: 2000              # and never keep more than this many
  archive_warn_mb: 500         # WARNING in the log above this directory size

  # --- street-door open feed (2026-08-25) ---
  # The ESP bus tap is the ONLY device that sees the door controller's own
  # acknowledgement that a street door physically opened, whoever commanded it.
  # The ABB cloud has never once reported a door-open event of its own (the
  # door-open comparator above has counted door_opens_both=0 and
  # door_opens_abb_only=0 since it started) - it only learns of opens made
  # through ABB's own channels, and every open so far has been the ESP acting
  # on the bus. Meanwhile nothing logs street-door openings to the house feed
  # at all, so a housemate letting someone in from the physical handset was
  # invisible to the whole system. This reports every ESP unlock edge
  # (_on_lock_activity) to the feed, classified by whether a ring episode for
  # that door was open (a visitor was let in - routine wording) or not
  # (someone opened the door with nobody ringing - noteworthy but not
  # alarming, usually a housemate buzzing in a friend who called ahead or
  # testing; feed only, never a push).
  door_open_feed: true          # master on/off; false reproduces today's behaviour exactly
  door_open_fold_s: 20          # fold unlocking/unlocked + auto-open retry edges for one visitor into one report
  door_open_ring_window_s: 90   # ring counts as "present" up to this long after it started (episode_close_s=75 always closes first)
