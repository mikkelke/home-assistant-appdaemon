# /conf/apps/intercom/abb_welcome_bridge.yaml
#
# Additive observer for the ABB Welcome integration - missed-call pushes with
# doorbell snapshots, the ring image/clip archive, the announce-after-unlock
# voice, the auto-open-off Open/Reject ring push with door voices, and the
# ABB/ESP comparators (rings + door-opens) that gather the phase-2 (ESP
# replacement) evidence. This app never presses buttons or toggles switches on
# the ABB device. Since 2026-08-13 it DOES use the media capabilities (announce
# TTS, arm_streaming + camera.record for ring clips), which dial the station
# but cannot open anything - and it unlocks a door in EXACTLY one case: a human
# pressed Open on the ring push, executed via the ESP lock entity, the same
# path as the dashboard's door buttons. Never on its own judgment. The ESP
# intercom app (intercom.yaml) stays authoritative for the doorbell and does
# NOT depend on this app - if this app dies, the house loses features, never
# the doorbell.

AbbWelcomeBridge:
  module: abb_welcome_bridge
  class: AbbWelcomeBridge
  # No custom `log:` stream on purpose: those must be declared in appdaemon.yaml, which lives
  # only on the box and is not in this repo - an undeclared stream fails instantiation on a
  # fresh deploy (it did, 2026-08-12, same trap as forecast_log three days earlier).
  # Only the notifier: intercom.py deliberately has NO dependency on this app
  # (an AppDaemon dependency would stop the doorbell app from loading if this
  # one broke), and this app resolves the notifier the same way intercom does.
  dependencies:
    - MobileNotifier

  # --- ABB entities (read-only) ---
  abb_event_entity: "event.abb_welcome_gateway_intercom"           # cloud-polled portal events (30 s interval)
  abb_ringing_sensor: "binary_sensor.abb_welcome_gateway_intercom_ringing"  # realtime SIP ring, 5 s hold
  abb_image_entity: "image.abb_welcome_gateway_latest_screenshot"  # gateway snapshot, poll-lagged 7-32 s after the ring
  abb_ring_bus_event: "abb_welcome_ring"                           # realtime HA bus event from the integration's SIP listener

  # --- ESP side (observed only - never actuated from here) ---
  esp_door_sensors:
    binary_sensor.intercomproxy_doorbell_front_door: "front door"
    binary_sensor.intercomproxy_doorbell_back_door: "back door"
  esp_lock_doors:
    lock.intercomproxy_front_door: "front door"
    lock.intercomproxy_back_door: "back door"
  auto_open_boolean: "input_boolean.auto_open_intercom"

  # Station -> door mapping. Evidence (2026-08-12, two independent ring
  # correlations against the ESP sensors; see abb_welcome_bridge.py header):
  #   14:24:44Z back-door ESP ring  <-> station 100000001 "Outdoor Station 1-1"
  #   16:35:28Z front-door ESP ring <-> station 100000002 "Outdoor Station 2-1"
  # Labels only - the comparator's station_door_matrix keeps re-verifying this.
  station_doors:
    "100000001": "back door"
    "100000002": "front door"

  # --- timing knobs (defaults shown; all measured 2026-08-12) ---
  pair_window_s: 10            # ESP and ABB rings ~50 ms apart when both work; 10 s is generous
  debounce_s: 5                # per-side re-ring fold, matches intercom.py + the ABB 5 s ring hold
  episode_close_s: 75          # classification final: unlock by +9 s, missed/screenshot by ~+35 s (30 s poll)
  suppress_window_s: 30        # unlock within +/-30 s of the ring = the house answered; not a real miss
  missed_decision_delay_s: 15  # wait for unlock evidence (lands ~ring+9 s) before pushing "missed"
  missed_max_age_s: 900        # ignore replayed/stale portal events (HA restart restores the last one)
  snapshot_probe_s: 6          # early snapshot probe; the normal capture is event-driven off the image entity

  # Missed-call push audience: everyone home, no category restriction.
  notify_target: "home"

  # Announce after auto-open (2026-08-13, restoring the policy agreed 2026-08-12 whose
  # box-direct deploy was lost to a repo sync): when a ring is answered by the house
  # opening the door, the door tells the visitor. FRONT ONLY - the back door reportedly
  # has a built-in voice, unverified; two overlapping voices are worse than none. Add
  # "back door" here only after standing at it during an auto-open.
  announce_after_unlock:
    front door: camera.abb_welcome_gateway_outdoor_station_2_1
  announce_message: "The door is open."
  announce_cooldown_s: 90
  announce_ring_window_s: 60

  # --- ring video clips (2026-08-13, "thumbnail and opening that give the video") ---
  # HA's native camera.record against the integration, probe-verified: h264 640x480,
  # ~450 KB per 10 s, needs arm_streaming first. Announce and record are mutually
  # exclusive per station (probed live: announce mid-record fails AND kills the
  # clip's video), so recording waits for a fresh announce to clear
  # (clip_announce_clear_s) and retries once shortly after.
  #
  # TIMING PHYSICS (user 2026-08-19: "the video is not from the ring, it's after -
  # often no person"): the station only streams WHILE DIALED, so there is no
  # pre-ring buffer for camera.record's lookback to reach into - video from before
  # the recording call CANNOT exist. With auto-open buzzing people in at ~+2 s,
  # a clip starting later often shows an empty doorway; the RING-MOMENT artifact
  # is the gateway SNAPSHOT (captured by the station at the ring itself), which
  # the gallery now shows first. Mitigation here: start the dial as early as the
  # announce allows (delay 8 s -> 3; back door has no announce, so it records
  # from ~+3 s) and record longer (10 s -> 15) to catch late arrivals/leavers.
  #
  # BACK DOOR ENABLED (user 2026-08-19: "the backdoor does not save video").
  # Residual unknown carried over from the announce work: dialing the station
  # MIGHT make the back unit beep/speak on its own - never verified. If anyone
  # reports the back door making sounds ~3 s after a ring, remove it here.
  # A manual unlock landing mid-recording loses only the announce (integration
  # refuses it, WARNING in the log) - the door still opens. Clips prune with
  # their photos (retain_days/max_files).
  clip_cameras:
    front door: camera.abb_welcome_gateway_outdoor_station_2_1
    back door: camera.abb_welcome_gateway_outdoor_station_1_1
  clip_seconds: 15
  clip_delay_s: 3
  clip_announce_clear_s: 5   # a front announce younger than this defers the dial once (+3 s)
  clip_record_dir: "/config/www/abb_doorbell"  # archive_dir as HA's container sees it

  # --- auto-open-OFF ring fallback (2026-08-13, Mikkel: "The notification if auto
  # is not on should be with open or reject", door voices for wait/no-answer/reject).
  # With auto-open ON none of this runs. With it OFF: first ring of an episode ->
  # actionable push to everyone home (Open buzzes via the ESP lock, same path as the
  # dashboard buttons; Reject speaks reject_message at the door), the door hears
  # ring_ack_message ~2 s in, and no_answer_after_s of silence speaks
  # no_answer_message and withdraws the push. Any unlock (auto, dashboard, push)
  # kills the pending buttons everywhere so a late press cannot re-buzz. Voices go
  # only to doors in announce_after_unlock (back door still pending verification);
  # the push itself works for both doors. Set a message to "" to disable that voice.
  # The portal's own call-missed push is suppressed for these rings - the house
  # already saw them, and after a Reject "missed" would be plain wrong.
  ring_ack_message: "One moment, please."
  no_answer_message: "Sorry, no one can answer the door right now."
  reject_message: "Sorry, we cannot open the door right now."
  no_answer_after_s: 45     # < episode_close_s so the episode is still tracked
  ring_action_window_s: 180 # Open/Reject pressed later than this is ignored

  # --- integration health watchdog (2026-08-13, found live during the feature audit:
  # leaked stream-worker retries from failed camera.record attempts flipped the front
  # camera unavailable for 90 minutes; one reload_config_entry cured it). A dead SIP
  # listener means ABB is deaf while the ESP still hears - the comparator counts that
  # as rings_esp_only and phase 2 stalls on bad evidence. Self-heals by reloading the
  # ABB config entry after health_unhealthy_s of sustained trouble, at most once per
  # health_heal_cooldown_s, pushing Mikkel on each heal and on recovery. Explicit bad
  # states only - unreadable sensors hold, they never trigger a reload. The ESP
  # doorbell does not depend on any of this.
  health_sip_entity: "sensor.abb_welcome_gateway_sip_listener"
  health_unhealthy_s: 600
  health_heal_cooldown_s: 3600
  health_notify: ["mikkel"]

  # --- ring image archive (same exposure model as the vacuum's rober2_maps:
  # /www inside the container = /data/homeassistant/www on the box, served
  # unauthenticated on LAN at /local/abb_doorbell/) ---
  archive_dir: "/www/abb_doorbell"
  archive_url_prefix: "/local/abb_doorbell"
  retain_days: 90              # prune snapshots older than this on every write
  max_files: 2000              # and never keep more than this many
  archive_warn_mb: 500         # WARNING in the log above this directory size
