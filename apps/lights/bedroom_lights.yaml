# /conf/apps/lights/bedroom_lights.yaml
#
# Effective occupancy (vacant vs occupied gate only):
#   binary_sensor.bedroom_active (apps/presence/room_active.py) OR bathroom PIR when bathroom
#   door is open OR an active bed-light session (see bedroom_lights.py class docstring).
# Dark/bright from room_state_text_entity (darkness_calculator).

bedroom_lights:
  module: bedroom_lights
  class: BedroomLights
  log: bedroom_lights_log

  bed_lights: "light.bedroom_bed_lights"
  ceiling_lights: "light.bedroom_ceiling_lights"
  # Reliable ON-edge only signal to START a bed-light session; their OFF edge is ignored.
  # Read directly here, not through binary_sensor.bedroom_active - this decision wants the
  # bed specifically, not the room (same as smart_cooling.yaml/bed_presence_compare.yaml).
  # Third entry (2026-08-12): the ESPHome pressure strip as an additional witness - local
  # and fast where Withings is cloud-lagged. Session start stays presence-gated, and only an
  # exact "on" counts anywhere this list is read, so an unavailable strip is inert.
  # Uses _either (2026-08-30, was _left): the sole occupant does not always sleep on the
  # left side, so the strip must arm from whichever half is occupied - same pattern as
  # smart_cooling. Withings stays authoritative until bed_presence_compare has ~5 good nights.
  withings_in_bed_entities:
    - binary_sensor.left_bedside
    - binary_sensor.right_bedside
    - binary_sensor.bed_presence_6b9c94_bed_occupied_either

  switch_device_id: "951e07324391856c37850361629523d7"
  remote_device_id: "fde0ce72582c723f4d8b729b522fc2fa"

  raw_bathroom_pir_sensor: "binary_sensor.bathroom_pir_presence"
  bathroom_door_sensor: "binary_sensor.bathroom_door_contact"

  mikkel_sleep_entity: "input_boolean.mikkel_sleep_mode"
  # Global mechanism: manual override toggle — ON pauses ALL automatic actions for this room
  manual_override_boolean: "input_boolean.bedroom_lights_manual"
  bedroom_blind_entity: "cover.bedroom_blind"
  # A "closed" blind can report 98-99 instead of a clean 100 (battery/motor slack); treat
  # >= this as closed so auto-on stays blocked. Matches wakeup_bedroom's closed_threshold.
  blind_closed_threshold: 95

  # Bed-light session latch (bed vs ceiling): single source of truth mirrored to
  # bed_session_entity and read by wakeup_bedroom for the wake ramp hand-off. Presence for
  # arming/cancelling the exit timer comes from binary_sensor.bedroom_active (room_active.py) -
  # since that primitive already unions the bed witnesses in with FP300/PIR, it cannot read
  # "not present" while a bed witness is asserting, so no separate live-witness hold is needed
  # on top of the exit debounce below (bedroom_lights carried one standalone through
  # 2026-08-31, before the primitive existed - see git history for that mechanism). See
  # bedroom_lights.py class docstring.
  bed_session_entity: input_boolean.bedroom_bed_session
  session_exit_debounce_sec: 300

  verbosity_level: "normal"
  room_state_text_entity: "sensor.room_state_bedroom_bathroom"
  darkness_confirmed_sensor_entity: "sensor.darkness_bedroom_bathroom"
