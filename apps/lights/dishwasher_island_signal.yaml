# ONLY this app uses island_lights_sg + island_light_1 (the dishwasher signal).
# FamilyRoomLights uses light.island_lights only - never SG/bulb1 - and owns the island whenever the signal is not showing.
#
# The signal shows only while Unemptied AND the kitchen is occupied:
#   bright: full light.island_lights (green), both AL off.
#   dark:   full group off; light.island_lights_sg on + island_light_1 green.
# Everywhere else (not Unemptied, or Unemptied with the kitchen empty): normal layout - main AL on, SG AL off,
# island_light_1 manual control released - and no light is touched.
# When the signal ends (kitchen clears, or no longer Unemptied) no light is powered on. The full group is switched
# off only if the signal itself powered it up from off in the bright case; any other lit island bulb is recolored
# to normal via main AL apply (turn_on_lights false) and FamilyRoomLights decides on/off.
DishwasherIslandSignal:
  module: dishwasher_island_signal
  class: DishwasherIslandSignal
  log: dishwasher_island_signal_log

  dishwasher_state_entity: "sensor.dishwasher_state"
  kitchen_pir_entity: "binary_sensor.kitchen_active"
  room_state_text_entity: "sensor.room_state_family_room"
  darkness_confirmed_sensor_entity: "sensor.darkness_family_room"

  signal_light_entity: "light.island_light_1"
  full_island_light_entity: "light.island_lights"
  island_sg_light_entity: "light.island_lights_sg"

  adaptive_lighting_main_switch: "switch.adaptive_lighting_island_lights"
  adaptive_lighting_sg_switch: "switch.adaptive_lighting_island_light_sg"

  unemptied_option: "Unemptied"

  signal_brightness_pct: 100
  # hs_color [hue 0-360, sat 0-100]: saturated green. Prefer over rgb_color on Hue so HA state matches the lamp.
  signal_hs: [120, 100]

  # presence_trust (apps/lights/presence_trust.py): kitchen mmWave-only presence for this many
  # minutes with the PIR silent, while the kitchen speaker plays, is SUSPECT - the signal is
  # never applied on ghost presence; an already-applied signal is held (off-hold unchanged).
  presence_suspect_after_minutes: 10
