# /conf/apps/lights/claudias_room_lights.yaml

# Manual control (physical wall switch + direct app/dashboard control of the light
# entities). Lights left on after Claudia leaves are resident_room_lights_off's job.
# The old automatic lighting (PIR occupancy + darkness_calculator room_state push) was
# disabled 2026-07-20 (user request); see the claudias_room_lights.py docstring to
# restore it.
claudias_room_lights:
  module: claudias_room_lights
  class: ClaudiasRoomLights
  log: claudias_room_lights_log

  # Wall switch: press_1 (top-left) = ceiling, press_3 (top-right) = string lights.
  ceiling_light:       "light.claudias_room_ceiling_lights"
  string_light:        "light.claudias_room_string_lights"

  verbosity_level: "normal"  # "quiet", "normal", "debug"
