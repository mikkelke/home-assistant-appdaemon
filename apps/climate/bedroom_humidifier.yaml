# /conf/apps/climate/bedroom_humidifier.yaml
# Runs the bedroom's SwitchBot evaporative humidifier before bed and through Mikkel's night and
# dries its wick in the morning - see bedroom_humidifier.py's module docstring for the rules.
# Publishes sensor.bedroom_humidifier (off | humidifying | drying | manual | no_water | unknown)
# with a `reason` attribute and, before bed and at night, a `phase` attribute (preload | night).
#
# Night: only while sleep_mode is on and the window is closed. On below on_below % of the bedroom
# humidity, off from off_at %, in run_mode (the quietest). Before bed: the same rule from
# preload_from until sleep mode turns on, at the latest until preload_until, while `person` is home
# and the window is closed; in preload_mode while `occupancy` is off, in run_mode while it is on or
# unreadable. Morning: when sleep mode turns off after a night or an evening in which it ran (or
# preload_until passes without sleep mode), drying_mode for drying_hours. Outside the evening's
# window, sleep mode off and the humidifier on = manual use, left alone. Water: one push to
# notify_target per empty spell, while `person` is home or on arrival.
#
# Run log: one JSON line per run, appended to bedroom_humidifier_log.jsonl beside the module
# (*_log.jsonl is gitignored); set log_file to move it. Restart state: state_file.
#
# No `log:` key on purpose: a named log stream must be declared in the box-only appdaemon.yaml
# first or the app fails to instantiate.

BedroomHumidifier:
  module: bedroom_humidifier
  class: BedroomHumidifier
  # Init-order guarantee for get_app("MobileNotifier") cached in initialize(); also reloads this app when MobileNotifier reloads.
  dependencies: MobileNotifier
  humidifier: humidifier.evaporative_humidifier_271a
  water_level: sensor.evaporative_humidifier_271a_water_level
  # The bedroom humidity comes from the first of these that reads a number and reported within
  # humidity_max_age_min minutes; none are averaged. Not the Salus (sensor.bedroom_humidity): it reads
  # whole percents, can stay quiet for hours and hangs above the humidifier. The humidifier's own
  # humidity sensor reads unknown.
  humidity_sources:
    - sensor.bedroom_seated_thermometer_humidity
    - sensor.airdot_b49928_humidity
  # The seated thermometer reports on every ~1 point change plus an hourly heartbeat that does not
  # change the state, so a quiet hour means an unchanged value; the age only catches a dead sensor.
  humidity_max_age_min: 240
  sleep_mode: input_boolean.mikkel_sleep_mode
  # on = open
  window: binary_sensor.bedroom_window_contact
  person: person.mikkel
  notify_target: mikkel
  health_entity: sensor.bedroom_humidifier
  # on = someone in the bedroom (room_active union of radar, PIR and bed sensors)
  occupancy: binary_sensor.bedroom_active
  run_mode: sleep
  # Before bed, house time, quoted HH:MM. An empty preload_from turns the phase off.
  preload_from: "22:00"
  preload_until: "02:00"
  preload_mode: medium
  drying_mode: drying_filter
  drying_hours: 2
  on_below: 40
  off_at: 42
  state_file: /conf/apps/climate/bedroom_humidifier_state.json
