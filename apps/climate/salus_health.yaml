# /conf/apps/climate/salus_health.yaml
# Watchdog for the Salus iT600 heating gear itself (thermostats + the Control
# Centre wiring centre): connectivity dropouts, fault registers, low battery.
# Admin-class information, so it goes to Mikkel only - see module docstring.

SalusHealth:
  module: salus_health
  class: SalusHealth
  # Init-order guarantee for get_app("MobileNotifier") cached in initialize(); also reloads this app when MobileNotifier reloads.
  dependencies: MobileNotifier
  # Substrings that identify Salus diagnostic entities among ALL binary_sensor/sensor
  # entities in HA - entities are discovered by these markers, not hardcoded per room.
  # "thermostat"/"control_centre" match the salus HA integration's own entities;
  # "salus_" additionally matches salus_gateway_diagnostics.py's directly-published
  # ones (sensor.salus_<slug>_*), so this watchdog keeps working across an integration
  # swap, or with both sources running at once during a migration. Trim this list to
  # just the source(s) you actually have installed if you'd rather be strict.
  entity_markers: [thermostat, control_centre, salus_]
  # Which of the discovered entities is "the controller" (wording only - "affects ALL
  # room heating" vs a single thermostat). The wiring centre's device name ("Control
  # Centre") comes from the gateway itself, so this is the same regardless of source.
  controller_marker: control_centre
  # How long a connectivity binary_sensor must read "off" continuously before alerting.
  offline_minutes: 10
  # The battery sensor reports percent, quantized in 20-point steps because the gateway
  # only ever sends a raw 0-5 level underneath (5 = full = 100%, so 2 = 40%). Alert at or
  # below this percent, then again only on a further drop (40% -> 20% alerts again;
  # staying at 40% does not re-nag).
  battery_warn_percent: 40
  notify_target: mikkel
  # Entity ids to skip even if they match the markers above.
  exclude_entities: []
  state_file: /conf/apps/climate/salus_health_state.json
