# Morning climate briefing -- ONE phone push a day with the climate decision SmartCooling
# has already computed (sensor.sleep_plan + sensor.smart_cooling_status): open/close
# windows, and whether to deploy + arm the AC for tonight. Advisory only -- never calls a
# climate/switch/cover service; its only outputs are the notification and its own logs.
#
# Trigger = the alarm (2026-07-29 fix -- replaces the old PIR/bed-exit motion trigger, which
# fired as early as 05:30 and misled the sleep plan's own window-feasibility test):
#   - Alarm enabled (input_boolean.wakeup_bedroom) -> send at the alarm time
#     (input_datetime.wakeup_bedroom), rescheduled whenever that datetime changes.
#   - Alarm disabled -> send at fallback_time instead.
#   - Alarm turned off DURING the morning window (woke early / cancelled) -> send
#     immediately -- but disabling it the night before must not send (still gated to
#     from_hour..until_hour).
# The fallback run never pre-empts a still-pending alarm (see morning_briefing.py's
# _alarm_pending_today). All three trigger paths funnel into the same once-per-day/home/
# data gates.
#
# Sent at most once per calendar day (last-sent date in state_file), gated on person_entity
# being home (suppress ONLY on a live "not_home" reading -- a dead/unknown sensor is never
# evidence of being away) and on sleep_plan_entity actually having published data (missing/
# unknown data does NOT mark the day as sent, so a later trigger retries).

MorningBriefing:
  module: morning_briefing
  class: MorningBriefing
  # Init-order guarantee for get_app("MobileNotifier") cached in initialize(); also reloads this app when MobileNotifier reloads.
  dependencies: MobileNotifier

  alarm_time_entity: input_datetime.wakeup_bedroom
  alarm_enabled_entity: input_boolean.wakeup_bedroom
  fallback_time: "07:00:00"
  person_entity: person.mikkel
  from_hour: 5
  until_hour: 12

  sleep_plan_entity: sensor.sleep_plan
  status_entity: sensor.smart_cooling_status
  climate_entity: climate.air_conditioner_thermostat
  enable_entity: input_boolean.smart_cooling

  notify_target: user
  # Push polish (Android companion extras; set any to "" to disable): the tag makes a
  # re-send REPLACE the previous briefing instead of stacking; the channel gives it its
  # own Android notification channel (tune sound/importance per-channel on the phone);
  # the icon brands it. click_url stays EMPTY on purpose: no clickAction = tapping opens
  # the HA app (companion default). A /local/ dashboard URL opened the phone BROWSER
  # instead (user 2026-07-22) -- only set this if a specific in-app view should open.
  notify_tag: morning_briefing
  notify_channel: Morning climate
  notify_icon: mdi:bed-clock
  click_url: ""
  state_file: /conf/apps/climate/morning_briefing_state.json
