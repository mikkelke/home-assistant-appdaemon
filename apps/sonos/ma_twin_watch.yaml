# /conf/apps/sonos/ma_twin_watch.yaml
# Reloads Music Assistant's Sonos provider when its HA twins stop mirroring the Sonos speakers
# (raw *_2 playing, MA twin idle/paused/off for hold_s). See ma_twin_watch.py for the rule and
# box/systemd/ for the host units that do the reload.

MaTwinWatch:
  module: ma_twin_watch
  class: MaTwinWatch
  log: sonos_log
  # Init-order guarantee for get_app("MobileNotifier") cached in initialize(); also reloads this app when MobileNotifier reloads.
  dependencies: MobileNotifier

  # Raw HA Sonos entity -> Music Assistant twin. scripts/check_speakers.py checks this against
  # config/sonos_speakers.yaml.
  pairs:
    media_player.bathroom_2: media_player.bathroom
    media_player.bedroom_2: media_player.bedroom
    media_player.claudias_room_2: media_player.claudias_room
    media_player.dining_room_2: media_player.dining_room
    media_player.kitchen_2: media_player.kitchen
    media_player.living_room_2: media_player.living_room
    media_player.guest_bathroom_2: media_player.guest_bathroom
    media_player.kristines_room_2: media_player.kristines_room
    media_player.rooftop_2: media_player.rooftop

  # Normal handoffs settle within seconds; mismatches of 10 s or more came only from a frozen twin.
  hold_s: 60
  cooldown_s: 1800
  # More than this in 24 h means MA is sick in a way a reload does not fix.
  max_per_day: 3
  verify_s: 600
  pending_s: 60
  check_s: 30
  request_file: /conf/host-requests/ma-restart.request
  notify_target: mikkel
